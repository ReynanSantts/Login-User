<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecLog — Sobre</title>
    <link rel="stylesheet" href="/pagsobre/style.css" />
    <script src="/pagsobre/script.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="TecLog">TecLog</a>
      <nav class="auth-actions" aria-label="Acesso">
        <button type="button" data-go="../pagcadastro/">Cadastrar</button>
        <button type="button" data-go="../paglogin/">Login</button>
      </nav>
    </header>

    <main class="about">
      <section class="about__copy">
        <div class="about__panel">
          <h1>Bem-vindo ao TecLog!</h1>
          <p>
            Crie sua conta ou faça login para acessar a plataforma. Um ambiente
            simples e seguro para gerenciar seu acesso.
          </p>
        </div>
      </section>

      <figure class="about__art" aria-label="Ilustração de login seguro">
        <img class="about__art-bg" src="/pagsobre/assets/268b2.png" alt="" />
        <img
          class="about__art-main"
          src="/pagsobre/assets/e6bba.png"
          alt="Mão acessando uma tela de login em um celular"
        />
      </figure>
    </main>
  </body>
</html>
